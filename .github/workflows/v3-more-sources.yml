name: Pexels UDH source deep probe
on:
  push:
    branches: [cinematic-reel-v3-20261013]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe HD/UHD CDN
        run: |
          pip install -q requests
          cat >/tmp/p.py <<'PY'
          import requests,concurrent.futures
          ids=[4030290,4030306,4030325,29031262,36670222,35503523,35441703,34938309,31599059,31317451,30319062,30329515,37510582]
          versions=[(q,s,f) for q in ['uhd','hd','sd'] for s in ['3840_2160','2160_3840','2560_1440','1920_1080','1080_1920','1280_720','720_1280','640_360'] for f in [24,25,30,29,23,60]]
          def test(x):
           i,q,s,f=x;u=f'https://videos.pexels.com/video-files/{i}/{i}-{q}_{s}_{f}fps.mp4'
           try:
            r=requests.head(u,timeout=6,allow_redirects=True,headers={'User-Agent':'Mozilla/5.0'})
            if r.status_code==200 and 'video' in r.headers.get('content-type',''):
             return (i,u,r.headers.get('content-length'))
           except:pass
          with concurrent.futures.ThreadPoolExecutor(max_workers=55) as ex:r=list(ex.map(test,[(i,*v) for i in ids for v in versions]))
          for x in r:
           if x:print('FOUND',*x,flush=True)
          for i in ids:
           if not any(x and x[0]==i for x in r):print('MISSING',i,flush=True)
          
          PY
          sed -i 's/^          //' /tmp/p.py
          python /tmp/p.py
