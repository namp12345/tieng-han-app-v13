name: New scenic clip scout
on:
  push:
    branches: [cinematic-reel-v3-20261013]
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Prepare
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q requests Pillow
      - name: Inspect 19 Pexels moving footage candidates
        run: |
          cat >/tmp/newclips.py <<'PY'
          import requests,concurrent.futures,subprocess,json,math,os
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          ids={"8664221":"Da Nang fishing boats beach","9791713":"Dragon Bridge","12737212":"Hoi An canal night","15693142":"Hoi An lantern boats dynamic","15809397":"Hoi An street pan","15809398":"Hoi An rickshaw wide","15809401":"Hoi An rickshaw close","19135695":"Ba Na Buddha","19135704":"Golden Bridge","28505876":"Da Nang coast","30319062":"Vietnam traditional food","30329515":"Vietnam close up food","31317451":"Vietnam food","34754952":"Da Nang skyline","34938309":"Da Nang coastal sunset","35441703":"Son Tra lighthouse aerial","35503523":"Da Nang coastal blue sky","37510579":"Hoi An lantern nightlife","37510582":"Hoi An scenic night boat"}
          poss=[(id,q,sz,fps) for id in ids for q in ('hd','sd') for sz in ('1920_1080','1080_1920','1280_720','720_1280') for fps in (24,25,30,29,60)]
          def scan(t):
           i,q,sz,fps=t;u=f'https://videos.pexels.com/video-files/{i}/{i}-{q}_{sz}_{fps}fps.mp4'
           try:
            r=requests.head(u,timeout=7)
            if r.status_code==200 and 'video/' in r.headers.get('content-type',''):return (i,u,int(r.headers.get('content-length','0')))
           except:pass
          with concurrent.futures.ThreadPoolExecutor(max_workers=35) as ex: results=[x for x in ex.map(scan,poss) if x]
          d={}
          for id,label in ids.items():
           c=[x for x in results if x[0]==id]
           if c:
            c.sort(key=lambda x:(0 if '1920_1080' in x[1] else 1,x[2]))
            d[id]={'label':label,'url':c[0][1],'size':c[0][2]}
            print('WORKS',id,label,c[0][1],flush=True)
           else:print('UNAVAILABLE',id,label,flush=True)
          P=Path('footage_audit');P.mkdir(exist_ok=True);(P/'media.json').write_text(json.dumps(d,indent=2))
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',16)
          panels=[]
          for i,meta in d.items():
           for sec in (1,3):
            dest=P/f'{i}_{sec}.jpg'
            try:
             subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y','-ss',str(sec),'-i',meta['url'],'-frames:v','1','-vf','scale=320:-1',str(dest)],timeout=35,check=True)
             im=Image.open(dest).convert('RGB');im.thumbnail((320,210));panels.append((i,meta['label'],sec,im))
            except Exception as e:print('BADFRAME',i,sec,str(e)[:90],flush=True)
          W,H=330,250;cols=4
          sheet=Image.new('RGB',(W*cols,H*math.ceil(len(panels)/cols)),'#ffffff');D=ImageDraw.Draw(sheet)
          for n,(i,label,sec,im) in enumerate(panels):
           x=n%cols*W;y=n//cols*H
           sheet.paste(im,(x,y+30));D.text((x+4,y+3),f'{i} {label[:23]} {sec}s',font=font,fill='black')
          sheet.save(P/'contact.jpg',quality=86)
          
          PY
          sed -i 's/^          //' /tmp/newclips.py
          python /tmp/newclips.py
      - uses: actions/upload-artifact@v4
        with:
          name: travel-v4-newclips
          path: footage_audit/
